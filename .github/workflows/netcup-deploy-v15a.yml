name: Schawa Grill - Netcup V1.5A live staff orders
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Install live queue patch? Unchecked = read-only'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: schawa-netcup-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify patch
        shell: bash
        run: |
          set -euo pipefail
          P=deploy/v1.5a/httpdocs/assets/staff-native.js
          test -s "$P"
          node --check "$P"
          grep -Fq "get('demo')!=='1'" "$P"
          grep -Fq "test:false" "$P"
          ! grep -Fq 'test=1' "$P"
          ! grep -Fq 'test:true' "$P"
      - name: Check remote baseline read-only
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          script: |
            set -eu
            B=/hosting257022.af9b8.netcup.net
            P="$B/httpdocs/assets/staff-native.js"
            test -f "$P" && test ! -L "$P"
            grep -Fq "get('server_test')==='1'" "$P" || { echo 'Unexpected remote baseline'; exit 1; }
            grep -Fq '&test=1' "$P" || { echo 'Remote feed already modified'; exit 1; }
            grep -Fq 'test:true' "$P" || { echo 'Remote action already modified'; exit 1; }
            echo 'Baseline OK'
      - name: Upload patch to staging
        if: ${{ inputs.deploy == true }}
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          source: 'deploy/v1.5a/httpdocs/assets/staff-native.js'
          target: '/hosting257022.af9b8.netcup.net/private/github-deploy-stage'
          overwrite: true
      - name: Backup and install patch
        if: ${{ inputs.deploy == true }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          script: |
            set -eu
            B=/hosting257022.af9b8.netcup.net
            SRC="$B/private/github-deploy-stage/deploy/v1.5a/httpdocs/assets/staff-native.js"
            DST="$B/httpdocs/assets/staff-native.js"
            test -s "$SRC" && test -f "$DST" && test ! -L "$DST"
            grep -Fq "get('demo')!=='1'" "$SRC"
            grep -Fq 'test:false' "$SRC"
            grep -Fq "get('server_test')==='1'" "$DST" || { echo 'Baseline changed'; exit 1; }
            grep -Fq '&test=1' "$DST" || { echo 'Baseline changed'; exit 1; }
            grep -Fq 'test:true' "$DST" || { echo 'Baseline changed'; exit 1; }
            D="$B/private/github-deploy-backups/v1.5a-$(date +%Y%m%d-%H%M%S)"
            mkdir -p "$D"
            cp -p "$DST" "$D/staff-native.js"
            cp "$SRC" "$DST"
            echo "V1.5A installed; backup: $D"
