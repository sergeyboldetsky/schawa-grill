name: Schawa Grill - Netcup V1.6.3 Cooking labels
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Actually install V1.6.3? Unchecked = read-only verification'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: schawa-netcup-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate package
        run: |
          set -euo pipefail
          node --check deploy/v1.6.3/httpdocs/assets/staff-native.js
          php -l deploy/v1.6.3/private/interfaces/kitchen.php
          php -l deploy/v1.6.3/private/interfaces/cook.php
          node --check deploy/v1.6.3/httpdocs/assets/app.js
      - name: Check server paths (read only)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          script: |
            set -eu
            B=/hosting257022.af9b8.netcup.net
            test -f "$B/httpdocs/assets/staff-native.js"; test ! -L "$B/httpdocs/assets/staff-native.js"; test "$(sha256sum "$B/httpdocs/assets/staff-native.js" | cut -d' ' -f1)" = d6a0cbb105a04b8437a16ffd23b529d5c38358da1f507e63cd5eaa6cf3186127 || { echo "Unexpected version: httpdocs/assets/staff-native.js"; exit 1; }
            test -f "$B/private/interfaces/kitchen.php"; test ! -L "$B/private/interfaces/kitchen.php"; test "$(sha256sum "$B/private/interfaces/kitchen.php" | cut -d' ' -f1)" = a814b288924fd52cbd9c2d01d49e858f6dafc023132e5228fd72af41cb752a23 || { echo "Unexpected version: private/interfaces/kitchen.php"; exit 1; }
            test -f "$B/private/interfaces/cook.php"; test ! -L "$B/private/interfaces/cook.php"; test "$(sha256sum "$B/private/interfaces/cook.php" | cut -d' ' -f1)" = a1b8afd0f6e90754724a279e934d67c958cbc196e86956d239b16c12aad97286 || { echo "Unexpected version: private/interfaces/cook.php"; exit 1; }
            test -f "$B/httpdocs/assets/app.js"; test ! -L "$B/httpdocs/assets/app.js"; test "$(sha256sum "$B/httpdocs/assets/app.js" | cut -d' ' -f1)" = 5045a2125e6f033fb91205ffbea793c7cbdaa626aa59897b59b3bdfdb56910d9 || { echo "Unexpected version: httpdocs/assets/app.js"; exit 1; }
            test -f "$B/httpdocs/index.html"; test ! -L "$B/httpdocs/index.html"; test "$(sha256sum "$B/httpdocs/index.html" | cut -d' ' -f1)" = 01aae0c30a65b6e5d2ae52c8a3313f0cc4e53c963d7f141dde04c767c167358f || { echo "Unexpected version: httpdocs/index.html"; exit 1; }
      - name: Upload staging package
        if: ${{ inputs.deploy == true }}
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          source: 'deploy/v1.6.3/httpdocs/assets/staff-native.js,deploy/v1.6.3/private/interfaces/kitchen.php,deploy/v1.6.3/private/interfaces/cook.php,deploy/v1.6.3/httpdocs/assets/app.js,deploy/v1.6.3/httpdocs/index.html'
          target: '/hosting257022.af9b8.netcup.net/private/github-deploy-stage'
          overwrite: true
      - name: Backup and install V1.6.3
        if: ${{ inputs.deploy == true }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          script: |
            set -eu
            B=/hosting257022.af9b8.netcup.net
            test -f "$B/httpdocs/assets/staff-native.js"; test ! -L "$B/httpdocs/assets/staff-native.js"; test "$(sha256sum "$B/httpdocs/assets/staff-native.js" | cut -d' ' -f1)" = d6a0cbb105a04b8437a16ffd23b529d5c38358da1f507e63cd5eaa6cf3186127 || { echo "Unexpected version: httpdocs/assets/staff-native.js"; exit 1; }
            test -f "$B/private/interfaces/kitchen.php"; test ! -L "$B/private/interfaces/kitchen.php"; test "$(sha256sum "$B/private/interfaces/kitchen.php" | cut -d' ' -f1)" = a814b288924fd52cbd9c2d01d49e858f6dafc023132e5228fd72af41cb752a23 || { echo "Unexpected version: private/interfaces/kitchen.php"; exit 1; }
            test -f "$B/private/interfaces/cook.php"; test ! -L "$B/private/interfaces/cook.php"; test "$(sha256sum "$B/private/interfaces/cook.php" | cut -d' ' -f1)" = a1b8afd0f6e90754724a279e934d67c958cbc196e86956d239b16c12aad97286 || { echo "Unexpected version: private/interfaces/cook.php"; exit 1; }
            test -f "$B/httpdocs/assets/app.js"; test ! -L "$B/httpdocs/assets/app.js"; test "$(sha256sum "$B/httpdocs/assets/app.js" | cut -d' ' -f1)" = 5045a2125e6f033fb91205ffbea793c7cbdaa626aa59897b59b3bdfdb56910d9 || { echo "Unexpected version: httpdocs/assets/app.js"; exit 1; }
            test -f "$B/httpdocs/index.html"; test ! -L "$B/httpdocs/index.html"; test "$(sha256sum "$B/httpdocs/index.html" | cut -d' ' -f1)" = 01aae0c30a65b6e5d2ae52c8a3313f0cc4e53c963d7f141dde04c767c167358f || { echo "Unexpected version: httpdocs/index.html"; exit 1; }
            S="$B/private/github-deploy-stage/deploy/v1.6.3"
            BK="$B/private/github-deploy-backups/v1.6.3-$(date +%Y%m%d-%H%M%S)"
            test "$(sha256sum "$S/httpdocs/assets/staff-native.js" | cut -d' ' -f1)" = ef1a434aa496b58a38b0d60b9bbb2fd7a45378fd82357e4e145610bc252004f7
            test "$(sha256sum "$S/private/interfaces/kitchen.php" | cut -d' ' -f1)" = 499321434b54fe0710219ac1cb0f7a7b905cfb04b8700f2daa19cf7fdbdd2aaf
            test "$(sha256sum "$S/private/interfaces/cook.php" | cut -d' ' -f1)" = e6a9dc8e63c9465d674820ae7ef7c8c1c9ac282cc37c5bf06cc53ee4ba13cc6c
            test "$(sha256sum "$S/httpdocs/assets/app.js" | cut -d' ' -f1)" = 0deb709f0530b99998da245907b32fe22382ac92984a51e7b40d816cfaa99410
            test "$(sha256sum "$S/httpdocs/index.html" | cut -d' ' -f1)" = d968187afe2f91850b3882e184f46d97bb1fa0732bcc1f4874c417135c0bb33a
            mkdir -p "$BK/httpdocs/assets"
            cp -p "$B/httpdocs/assets/staff-native.js" "$BK/httpdocs/assets/staff-native.js"
            mkdir -p "$BK/private/interfaces"
            cp -p "$B/private/interfaces/kitchen.php" "$BK/private/interfaces/kitchen.php"
            mkdir -p "$BK/private/interfaces"
            cp -p "$B/private/interfaces/cook.php" "$BK/private/interfaces/cook.php"
            mkdir -p "$BK/httpdocs/assets"
            cp -p "$B/httpdocs/assets/app.js" "$BK/httpdocs/assets/app.js"
            mkdir -p "$BK/httpdocs"
            cp -p "$B/httpdocs/index.html" "$BK/httpdocs/index.html"
            mkdir -p "$BK/httpdocs/api/orders"
            rollback() {
              cp -p "$BK/httpdocs/assets/staff-native.js" "$B/httpdocs/assets/staff-native.js" || true
              cp -p "$BK/private/interfaces/kitchen.php" "$B/private/interfaces/kitchen.php" || true
              cp -p "$BK/private/interfaces/cook.php" "$B/private/interfaces/cook.php" || true
              cp -p "$BK/httpdocs/assets/app.js" "$B/httpdocs/assets/app.js" || true
              cp -p "$BK/httpdocs/index.html" "$B/httpdocs/index.html" || true
            }
            trap rollback EXIT
            cp "$S/httpdocs/assets/staff-native.js" "$B/httpdocs/assets/staff-native.js"
            cp "$S/private/interfaces/kitchen.php" "$B/private/interfaces/kitchen.php"
            cp "$S/private/interfaces/cook.php" "$B/private/interfaces/cook.php"
            cp "$S/httpdocs/assets/app.js" "$B/httpdocs/assets/app.js"
            cp "$S/httpdocs/index.html" "$B/httpdocs/index.html"
            trap - EXIT
            echo "V1.6.3 installed. Backup: $BK"
