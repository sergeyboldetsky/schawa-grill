name: Schawa Grill - Netcup V1.5C staff interface fix
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Install V1.5C? (unchecked = read-only check)'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: schawa-netcup-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript
        run: node --check deploy/v1.5c/httpdocs/assets/staff-native.js
      - name: Check Netcup destination
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          script: |
            set -eu
            B=/hosting257022.af9b8.netcup.net
            test -f "$B/httpdocs/assets/staff-native.js"
            test ! -L "$B/httpdocs/assets/staff-native.js"
            test -d "$B/private"
      - name: Stage file
        if: ${{ inputs.deploy == true }}
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          source: 'deploy/v1.5c/httpdocs/assets/staff-native.js'
          target: '/hosting257022.af9b8.netcup.net/private/github-deploy-stage'
          overwrite: true
      - name: Backup and install
        if: ${{ inputs.deploy == true }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          script: |
            set -eu
            B=/hosting257022.af9b8.netcup.net
            S="$B/private/github-deploy-stage/deploy/v1.5c/httpdocs/assets/staff-native.js"
            D="$B/httpdocs/assets/staff-native.js"
            test -s "$S"
            test -f "$D"
            test ! -L "$D"
            grep -Fq 'staff-live.js?v=14h' "$D" || { echo 'Unexpected server version; no changes made'; exit 1; }
            BK="$B/private/github-deploy-backups/v1.5c-$(date +%Y%m%d-%H%M%S)"
            mkdir -p "$BK"
            cp -p "$D" "$BK/staff-native.js"
            cp "$S" "$D"
            grep -Fq 'single MySQL interface' "$D"
            echo "V1.5C installed. Backup: $BK"
