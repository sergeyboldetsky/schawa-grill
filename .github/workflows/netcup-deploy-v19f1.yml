name: Schawa Grill - Netcup V1.9F.1 History design
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Actually install V1.9F.1? Unchecked = read-only verification'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: schawa-netcup-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate package
        run: node --check deploy/v1.9f1/httpdocs/assets/app.js
      - name: Check server paths (read only)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          script: |
            set -eu
            B=/hosting257022.af9b8.netcup.net
            test ! -L "$B/httpdocs/index.html"; test -f "$B/httpdocs/index.html"
            ACTUAL=$(sha256sum "$B/httpdocs/index.html" | cut -d' ' -f1)
            echo "index.html: $ACTUAL (expected 607a75a71450d85fb72320fa048e9f023eef9303a5bc1b851f493c10ed014994)"
            test "$ACTUAL" = 607a75a71450d85fb72320fa048e9f023eef9303a5bc1b851f493c10ed014994
            test ! -L "$B/httpdocs/assets/app.js"; test -f "$B/httpdocs/assets/app.js"
            ACTUAL=$(sha256sum "$B/httpdocs/assets/app.js" | cut -d' ' -f1)
            echo "assets/app.js: $ACTUAL (expected 206855f3d71dcd15015bd00bd665cc0d0e7e6bceab3a571cf87842a4b21ecf93)"
            test "$ACTUAL" = 206855f3d71dcd15015bd00bd665cc0d0e7e6bceab3a571cf87842a4b21ecf93
      - name: Upload staging package
        if: ${{ inputs.deploy == true }}
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          source: 'deploy/v1.9f1/httpdocs/index.html,deploy/v1.9f1/httpdocs/assets/app.js'
          target: '/hosting257022.af9b8.netcup.net/private/github-deploy-stage'
          overwrite: true
      - name: Backup and install V1.9F.1
        if: ${{ inputs.deploy == true }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          script: |
            set -eu
            B=/hosting257022.af9b8.netcup.net
            test ! -L "$B/httpdocs/index.html"; test -f "$B/httpdocs/index.html"
            ACTUAL=$(sha256sum "$B/httpdocs/index.html" | cut -d' ' -f1)
            echo "index.html: $ACTUAL (expected 607a75a71450d85fb72320fa048e9f023eef9303a5bc1b851f493c10ed014994)"
            test "$ACTUAL" = 607a75a71450d85fb72320fa048e9f023eef9303a5bc1b851f493c10ed014994
            test ! -L "$B/httpdocs/assets/app.js"; test -f "$B/httpdocs/assets/app.js"
            ACTUAL=$(sha256sum "$B/httpdocs/assets/app.js" | cut -d' ' -f1)
            echo "assets/app.js: $ACTUAL (expected 206855f3d71dcd15015bd00bd665cc0d0e7e6bceab3a571cf87842a4b21ecf93)"
            test "$ACTUAL" = 206855f3d71dcd15015bd00bd665cc0d0e7e6bceab3a571cf87842a4b21ecf93
            S="$B/private/github-deploy-stage/deploy/v1.9f1"
            BK="$B/private/github-deploy-backups/v1.9f1-$(date +%Y%m%d-%H%M%S)"
            test "$(sha256sum "$S/httpdocs/index.html" | cut -d' ' -f1)" = 99c44907c9714813776259d4666450c532090c616665cbcde303e6fb2eab34d5
            mkdir -p "$BK/httpdocs"
            cp -p "$B/httpdocs/index.html" "$BK/httpdocs/index.html"
            mkdir -p "$BK/httpdocs"
            mkdir -p "$BK/private"
            mkdir -p "$BK/httpdocs/api"
            mkdir -p "$BK/httpdocs/assets"
            test "$(sha256sum "$S/httpdocs/assets/app.js" | cut -d' ' -f1)" = ef0a800255775775456ce11f32ec8d1c048f8954bb39c8523bd35f3ea160d1b3
            mkdir -p "$BK/httpdocs/assets"
            cp -p "$B/httpdocs/assets/app.js" "$BK/httpdocs/assets/app.js"
            mkdir -p "$BK/httpdocs/api/orders"
            rollback() {
              cp -p "$BK/httpdocs/index.html" "$B/httpdocs/index.html"
              cp -p "$BK/httpdocs/assets/app.js" "$B/httpdocs/assets/app.js"
            }
            trap rollback EXIT
            cp "$S/httpdocs/index.html" "$B/httpdocs/index.html"
            cp "$S/httpdocs/assets/app.js" "$B/httpdocs/assets/app.js"
            trap - EXIT
            echo "Installed V1.9F.1. Backup: $BK"
